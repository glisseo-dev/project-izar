query GetVisibleNow($locationId: ID!) {
  visibleNow(locationId: $locationId) {
    id
    name
    magnitude
    constellation {
      name
    }
    ... on Star {
      spectralType
    }
    ... on Nebula {
      nebulaType
    }
    ... on Galaxy {
      galaxyType
      distanceLightYears
    }
  }
}

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The examples repeat class names across modules, which CodeQL reports as clashing. They are
      # ignored in the config and also stay out of the manual build below, which compiles only the
      # root reactor.
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        run: ./mvnw -B -DskipTests install

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

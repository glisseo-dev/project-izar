version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The wrapper stays on Maven 3.9: under 3.10, central-publishing-maven-plugin builds a
      # bundle that Central rejects with "Bundle has content that does NOT have a .pom file"
      # (mavenplugins/central-publishing-maven-plugin#78). The Maven plugin also targets the 3.9
      # API that a 3.9 distribution bundles. Moving to 3.10 is a deliberate decision.
      - dependency-name: "org.apache.maven:apache-maven"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.apache.maven:maven-plugin-api"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: "gradle"
    directory: "/izar-gradle-plugin"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
